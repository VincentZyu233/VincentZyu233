# 🚀 VitePress 双平台部署工作流
# 同时部署到 GitHub Pages 和 Cloudflare Pages
# 所有 PR 和 main 推送都会验证构建；带独立发布标记的 main 最新提交才会部署

name: Deploy VitePress Sites

on:
  push:
    branches:
      - main
  pull_request:

# 🔐 权限配置
permissions:
  contents: read          # 📖 读取仓库代码

# 🔄 并发控制：同一时间只跑一个部署，新的不会取消正在跑的
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify documentation build
        run: yarn docs:build

  should-deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.marker.outputs.should_deploy }}
    steps:
      - id: marker
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MESSAGE" =~ (^|[^[:alnum:]_-])\[pub(-|\ )page\]($|[^[:alnum:]_-]) ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # ═══════════════════════════════════════════════════
  # 📦 Job 1: 部署到 GitHub Pages（子路径 /VincentZyu233/）
  # ═══════════════════════════════════════════════════
  deploy-gh-pages:
    needs:
      - verify
      - should-deploy
    runs-on: ubuntu-latest
    # 🔍 验证通过且最新提交带独立发布标记时才部署
    if: needs.should-deploy.outputs.should_deploy == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      # 📥 拉取代码
      - name: Checkout code
        uses: actions/checkout@v7

      # 🟢 安装 Node.js 并启用 yarn 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'yarn'

      # 📦 严格按 yarn.lock 安装依赖，不更新版本号
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🔨 构建 GitHub Pages 版本（带子路径 base）
      - name: Build for GitHub Pages
        env:
          VITEPRESS_BASE: '/VincentZyu233/'
        run: yarn docs:build

      # ⚙️ 配置 GitHub Pages 环境
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # 📤 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      # 🚀 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ═══════════════════════════════════════════════════
  # ☁️ Job 2: 部署到 Cloudflare Pages（根路径 /）
  # ═══════════════════════════════════════════════════
  deploy-cf-pages:
    needs:
      - verify
      - should-deploy
    runs-on: ubuntu-latest
    # 🔍 验证通过且最新提交带独立发布标记时才部署
    if: needs.should-deploy.outputs.should_deploy == 'true'
    permissions:
      contents: read
      deployments: write
    steps:
      # 📥 拉取代码
      - name: Checkout code
        uses: actions/checkout@v7

      # 🟢 安装 Node.js 并启用 yarn 缓存
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'yarn'

      # 📦 严格按 yarn.lock 安装依赖，不更新版本号
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 🔨 构建 Cloudflare 版本（根路径 base）
      - name: Build for Cloudflare Pages
        env:
          VITEPRESS_BASE: '/'
        run: yarn docs:build

      # ☁️ 发布到 Cloudflare Pages
      # 🔑 需要在 repo Settings > Secrets 配置以下密钥：
      #    - CLOUDFLARE_API_TOKEN
      #    - CLOUDFLARE_ACCOUNT_ID
      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vincentzyu-vitepress  # 📝 Cloudflare 仪表盘中的项目名称
          directory: docs/.vitepress/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
